<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dulat Arena</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #1f2328; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100% - 40px, 640px); margin: 12vh auto 40px; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 650; letter-spacing: -.025em; }
    .subtitle { margin: 0 0 30px; color: #59636e; }
    nav { border-top: 1px solid #d8dee4; }
    nav a { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 17px 2px; border-bottom: 1px solid #d8dee4; color: #1f2328; text-decoration: none; font-weight: 550; }
    nav a:hover { color: #176c57; }
    nav a:focus-visible { outline: 2px solid #176c57; outline-offset: 4px; }
    nav a[aria-disabled="true"] { opacity: .45; pointer-events: none; }
    .arrow { color: #69747d; font-weight: 400; }
    #status { min-height: 1.5em; margin-top: 18px; color: #59636e; font-size: 13px; }
    #status.error { color: #a12828; }
    @media (max-width: 520px) { main { margin-top: 50px; } }
  </style>
</head>
<body>
  <main>
    <h1>Dulat Arena</h1>
    <p class="subtitle">Соревнование</p>
    <nav aria-label="Ресурсы соревнования">
      <a id="group-link" target="_blank" rel="noopener" aria-disabled="true"><span>Группа Codeforces</span><span class="arrow" aria-hidden="true">↗</span></a>
      <a id="compiler-link" target="_blank" rel="noopener" aria-disabled="true"><span>C++ компилятор</span><span class="arrow" aria-hidden="true">↗</span></a>
    </nav>
    <p id="status" role="status" aria-live="polite">Загрузка…</p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
